    --line-soft:rgba(34,51,63,.07);
    --blue:#7ea4bc;
    --blue-deep:#315871;
    --blue-ink:#26495f;
    --blue-soft:#d9e6ed;
    --peach:#d6a183;
    --peach-soft:#efd5c5;
    --gold:#e7c68b;
    --night:#0d2132;
    --night-2:#173b4f;
    --night-3:#245066;
    --cream:#fff7e9;
    --cream-soft:rgba(255,247,233,.68);
    --cream-faint:rgba(255,247,233,.38);
    --serif:"Source Han Serif SC","Source Han Serif CN","Source Han Serif","思源宋体","Noto Serif CJK SC","Songti SC","STSong","STZhongsong","SimSun",serif;
    --source-serif:"Source Han Serif SC","Source Han Serif CN","Source Han Serif","思源宋体","思源宋体 CN","Noto Serif CJK SC","Songti SC","STSong","SimSun",serif;
    --sans:"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    --ease:cubic-bezier(.22,.8,.2,1);
    --ease-out:cubic-bezier(.16,1,.3,1);
    --shadow:0 24px 60px rgba(30,48,61,.14);
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html{
    -webkit-text-size-adjust:100%;
    height:100%;
    background:#091824;
    overflow:hidden;
  }
  body{
    height:100%;
    background:
      radial-gradient(65% 45% at 50% 0%,rgba(79,121,143,.20),transparent 70%),
      #091824;
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.8;
    letter-spacing:.01em;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  button{font:inherit;color:inherit;background:none;border:0}
  button,a{-webkit-tap-highlight-color:transparent}
  img{display:block;max-width:100%}
  svg{display:block}
  ::selection{background:rgba(126,164,188,.28);color:var(--ink)}
  :focus-visible{outline:2px solid var(--peach);outline-offset:4px}
  [hidden]{display:none !important}

  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }
  .skip{
    position:fixed;left:16px;top:-70px;z-index:200;
    padding:9px 15px;border-radius:999px;
    background:var(--cream);color:var(--night);
    font-size:12px;text-decoration:none;
    transition:top .25s var(--ease);
  }
  .skip:focus{top:14px}

  .page{
    position:relative;isolation:isolate;
    width:100%;max-width:480px;height:100vh;height:100svh;margin:0 auto;
    background:var(--paper);
    box-shadow:0 0 100px rgba(0,0,0,.38);
    overflow:hidden;
  }

  .opening,.blind,.wish{
    position:absolute;inset:0;
    width:100%;height:100%;min-height:0;
    margin:0;
    border-radius:0;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transform:translateY(10px) scale(.997);
    transition:opacity .4s ease,transform .5s var(--ease);
    z-index:1;
    overflow:hidden;
  }
  .opening.is-active,.blind.is-active,.wish.is-active{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    transform:none;
    z-index:3;
  }
  .opening.is-active{z-index:4}
  .opening:focus,.blind:focus,.wish:focus{outline:none}

  /* 小标签 / 章节标题 */
  .micro{
    font-family:var(--sans);
    font-size:9.5px;line-height:1.5;
    letter-spacing:.19em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .chapter{
    display:flex;align-items:center;gap:10px;
    font-family:var(--sans);
    font-size:10px;line-height:1.5;
    letter-spacing:.17em;
    color:var(--muted);
  }
  .chapter::before{
    content:"";width:22px;height:1px;
    background:currentColor;opacity:.55;flex:none;
  }
  .chapter b{font-weight:400;color:var(--blue-deep);letter-spacing:.08em}
  .display{
    font-family:var(--serif);
    font-weight:500;
    letter-spacing:-.025em;
  }

  /* 通用按钮 */
  .primary-btn{
    position:relative;
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    min-height:54px;padding:0 25px;
    border-radius:999px;
    background:var(--night);
    color:var(--cream);
    font-size:14px;line-height:1;
    letter-spacing:.08em;
    cursor:pointer;
    box-shadow:0 12px 30px rgba(13,33,50,.18);
    transition:transform .35s var(--ease),background .35s var(--ease),box-shadow .35s var(--ease);
  }
  .primary-btn:hover{transform:translateY(-2px);background:var(--blue-ink);box-shadow:0 16px 34px rgba(13,33,50,.24)}
  .primary-btn:active{transform:translateY(0) scale(.985)}
  .primary-btn svg{width:17px;height:17px;flex:none}
  .primary-btn .arrow{
    transition:transform .35s var(--ease);
  }
  .primary-btn:hover .arrow{transform:translateX(3px)}

  /* 滚动淡入 */
  [data-reveal]{
    opacity:0;
    transform:translateY(17px);
    transition:opacity .8s ease,transform .9s var(--ease-out);
    transition-delay:var(--reveal-delay,0ms);
  }
  [data-reveal].is-in{opacity:1;transform:none}

  /* ============================================================
     01 · 开场
     ============================================================ */
  .opening{
    display:grid;
    grid-template-rows:auto 1fr auto;
    gap:24px;
    padding:
      max(26px,env(safe-area-inset-top))
      27px
      calc(max(25px,env(safe-area-inset-bottom)) + 30px);
    color:var(--cream);
    background:
      radial-gradient(80% 58% at 14% 94%,rgba(206,153,121,.18),transparent 68%),
      radial-gradient(90% 60% at 96% 0%,rgba(83,132,156,.32),transparent 64%),
      linear-gradient(158deg,#0b1b29 0%,#10293b 48%,#173a4e 100%);
    overflow:hidden;
  }
  .opening::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(255,247,233,.10) .5px,transparent .5px);
    background-size:5px 5px;
    opacity:.28;
    mix-blend-mode:soft-light;
  }
  .opening::after{
    content:"";position:absolute;left:27px;right:27px;top:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,247,233,.18),transparent);
    pointer-events:none;
  }
  .opening-art{
    position:absolute;right:-168px;top:-188px;
    width:480px;height:480px;
    color:rgba(255,247,233,.24);
    pointer-events:none;
    animation:orbitDrift 26s ease-in-out infinite alternate;
  }
  .opening-art .orbit-slow{animation:orbitSpin 60s linear infinite;transform-origin:50% 50%}
  .opening-constellation{
    position:absolute;z-index:1;
    right:21px;top:78px;
    width:116px;height:108px;
    color:rgba(255,247,233,.58);
    pointer-events:none;
  }
  @keyframes orbitDrift{
    from{transform:translate3d(0,0,0) rotate(-1deg)}
    to{transform:translate3d(-8px,10px,0) rotate(1deg)}
  }
  @keyframes orbitSpin{
    from{transform:rotate(0)}
    to{transform:rotate(360deg)}
  }
  .opening-top{
    position:relative;z-index:2;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .opening-top .micro{color:rgba(255,247,233,.47)}
  .opening-top .dotline{
    display:flex;align-items:center;gap:8px;
  }
  .opening-top .dotline i{
    width:4px;height:4px;border-radius:50%;
    background:var(--peach);opacity:.9;
  }
  .opening-main{
    position:relative;z-index:2;
    align-self:center;
    width:100%;
    max-width:355px;
    padding-top:10px;
    text-align:center;
  }
  .opening-kicker{
    display:flex;align-items:center;justify-content:center;gap:9px;
    margin-bottom:22px;
    color:rgba(255,247,233,.55);
    font-size:10px;line-height:1.5;
    letter-spacing:.2em;
  }
  .opening-kicker::after{
    content:"";height:1px;flex:1;max-width:58px;
    background:rgba(255,247,233,.22);
  }
  .opening h1{
    font-family:var(--serif);
    font-size:clamp(41px,11.9vw,50px);
    line-height:1.34;
    font-weight:500;
    letter-spacing:-.04em;
    color:var(--cream);
  }
  .opening-sub{
    margin-top:18px;
    color:rgba(255,247,233,.54);
    font-family:var(--sans);
    font-size:12px;
    line-height:2;
    letter-spacing:.16em;
  }
  .opening h1 .mark{
    color:#f4e1c8;
    background-image:linear-gradient(transparent 76%,rgba(214,161,131,.36) 76%,rgba(214,161,131,.36) 90%,transparent 90%);
    background-repeat:no-repeat;
    background-size:100% 100%;
  }
  .opening-foot{
    position:relative;z-index:2;
    display:flex;align-items:center;justify-content:center;
    padding-top:14px;
    border-top:1px solid rgba(255,247,233,.11);
  }
  .page-next{
    display:grid;place-items:center;
    width:41px;height:41px;
    border:1px solid rgba(255,247,233,.22);
    border-radius:50%;
    color:rgba(255,247,233,.8);
    background:rgba(255,247,233,.03);
    cursor:pointer;
    justify-self:center;
    transition:background .3s ease,border-color .3s ease,transform .35s var(--ease);
  }
  .page-next:hover{background:rgba(255,247,233,.09);border-color:rgba(255,247,233,.38);transform:translateX(2px)}
  .page-next svg{width:15px;height:15px}

  /* 音乐开关 */
  .sound-toggle{
    position:fixed;z-index:90;
    top:max(16px,env(safe-area-inset-top));
    right:max(16px,calc(50vw - 240px + 16px));
    display:grid;place-items:center;
    width:40px;height:40px;
    border:1px solid rgba(255,247,233,.2);
    border-radius:50%;
    background:rgba(13,33,50,.62);
    color:rgba(255,247,233,.82);
    cursor:pointer;
    opacity:0;transform:translateY(-5px) scale(.94);
    pointer-events:none;
    transition:opacity .3s ease,transform .35s var(--ease),background .3s ease;
  }
  .sound-toggle.is-visible{opacity:1;transform:none;pointer-events:auto}
  .sound-toggle:hover{background:rgba(13,33,50,.82)}
  .sound-toggle svg{width:18px;height:18px}
  .sound-toggle .waves,.sound-toggle .slash{transition:opacity .2s ease}
  .sound-toggle .slash{opacity:0}
  .sound-toggle.is-muted .waves{opacity:.16}
  .sound-toggle.is-muted .slash{opacity:1}

  /* 开场入场动画 */
  .opening-top{animation:riseIn .8s .05s var(--ease-out) both}
  .opening-main{animation:riseIn .9s .14s var(--ease-out) both}
  .opening-foot{animation:riseIn .9s .26s var(--ease-out) both}
  @keyframes riseIn{
    from{opacity:0;transform:translateY(18px)}
    to{opacity:1;transform:translateY(0)}
  }

  .opening::before{
    background-image:radial-gradient(rgba(48,84,105,.09) .45px,transparent .45px);
    opacity:.18;
    mix-blend-mode:normal;
  }
  .opening::after{
    background:linear-gradient(90deg,transparent,rgba(40,74,94,.15),transparent);
  }
  .opening-art,.opening-constellation{display:none}
  .opening-top .micro{color:rgba(38,66,84,.58)}
  .opening-kicker{color:rgba(38,66,84,.55)}
  .opening-kicker::after{background:rgba(38,66,84,.2)}
  .opening h1{color:#29485c}
  .opening h1 .mark{
    color:#29485c;
    background-image:linear-gradient(transparent 78%,rgba(126,164,188,.28) 78%,rgba(126,164,188,.28) 91%,transparent 91%);
  }
  .opening-sub{color:rgba(38,66,84,.60)}
  .opening-foot{border-top-color:rgba(38,66,84,.15)}
  .page-next{
    border-color:rgba(38,66,84,.22);
    color:rgba(38,66,84,.76);
    background:rgba(255,255,255,.20);
  }
  .page-next:hover{
    background:rgba(255,255,255,.44);
    border-color:rgba(38,66,84,.36);
  }

  /* ============================================================
     02 · 盲盒
     ============================================================ */
  .blind{
    display:flex;flex-direction:column;
    margin:0;
    padding:clamp(76px,10.5vh,104px) 24px max(28px,env(safe-area-inset-bottom));
    border-radius:0;
    background:
      radial-gradient(110% 60% at 50% -6%,#fffaf1 0%,transparent 58%),
      radial-gradient(70% 40% at 98% 100%,rgba(216,194,165,.15),transparent 70%),
      var(--paper);
    color:var(--ink);
    z-index:2;
  }
  .blind::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(39,58,69,.085) .48px,transparent .48px);
    background-size:5px 5px;
    opacity:.4;
  }
  .blind > *{position:relative;z-index:1}
  .blind-head{flex:none;max-width:355px}
  .blind-stage{
    flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    width:100%;min-height:0;
    margin:8px 0 6px;
  }
  .pick-copy{
    flex:none;
    margin:0 0 16px;
    font-family:"Microsoft YaHei","微软雅黑","PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
    font-size:clamp(28px,8vw,36px);
    line-height:1.4;
    font-weight:500;
    letter-spacing:-.02em;
    color:var(--ink);
    text-align:center;
  }
  .blind.is-fortune .pick-copy{display:none}
  .blind.is-fortune .blind-stage{justify-content:center}

  .blind-tower{
    display:flex;flex-direction:column;align-items:center;gap:10px;
    width:100%;
    transition:opacity .35s ease,transform .45s var(--ease);
  }
  .blind.is-fortune .blind-head{display:none}
  .blind.is-fortune .blind-tower{display:none}
  .tower-row{display:flex;justify-content:center;gap:12px;width:100%}

  .blind-box{
    position:relative;
    width:clamp(80px,25vw,100px);
    height:clamp(78px,24.4vw,98px);
    padding:0;border:0;background:none;border-radius:14px;
    cursor:pointer;
    transition:transform .35s var(--ease),opacity .35s ease;
  }
  .blind-box::after{
    content:"";position:absolute;left:14%;right:14%;bottom:-4px;height:7px;
    border-radius:50%;background:rgba(42,65,78,.13);
    filter:blur(3px);z-index:-1;transition:opacity .35s ease;
  }
  .blind-box:hover{transform:translateY(-3px)}
  .blind-box:active{transform:translateY(0) scale(.985)}
  .blind-box:focus-visible{outline-offset:7px}
  .blind-box.is-open{pointer-events:none;cursor:default}
  .blind-box.is-open:hover{transform:none}
  .blind-box.is-open::after{opacity:.45}
  .blind-box.is-last .box-art{animation:lastBoxBreathe 2.8s ease-in-out infinite}
  .blind-box.is-last:focus-visible{outline:1px dashed rgba(165,78,63,.52);outline-offset:4px}
  @keyframes lastBoxBreathe{
    0%,100%{filter:drop-shadow(0 12px 12px rgba(47,72,88,.16))}
    50%{filter:drop-shadow(0 12px 18px rgba(214,161,131,.38))}
  }

  .tower-row:nth-child(1) .blind-box{--tilt:-1.2deg}
  .tower-row:nth-child(2) .blind-box:nth-child(1){--tilt:1.4deg}
  .tower-row:nth-child(2) .blind-box:nth-child(2){--tilt:-1.7deg}
  .tower-row:nth-child(3) .blind-box:nth-child(1){--tilt:-1.5deg}
  .tower-row:nth-child(3) .blind-box:nth-child(2){--tilt:.8deg}
  .tower-row:nth-child(3) .blind-box:nth-child(3){--tilt:-.9deg}

  .box-art{
    position:absolute;inset:2% 0 0;
    display:block;
    transform:rotate(var(--tilt,0deg));
    transform-origin:50% 100%;
    filter:drop-shadow(0 12px 12px rgba(47,72,88,.16));
    transition:transform .45s var(--ease),filter .4s ease;
  }
  .box-mouth{
    position:absolute;left:10%;right:10%;top:31%;height:10%;
    border-radius:50%;
    background:#214356;
    opacity:0;
    z-index:1;
    transition:opacity .3s ease;
  }
  .box-body{
    position:absolute;left:10%;right:10%;bottom:7%;height:57%;
    z-index:2;
    border-radius:4px 4px 8px 8px;
    background:linear-gradient(135deg,#a8c9d8 0%,#7fa6bb 48%,#52798f 100%);
    border:1px solid rgba(48,79,97,.36);
    box-shadow:inset 0 -10px 16px rgba(34,61,77,.14),inset 0 2px 0 rgba(255,247,233,.22);
    transition:filter .4s ease,opacity .4s ease;
  }
  .box-body::before{
    content:"";position:absolute;left:50%;top:0;
    width:21%;height:100%;transform:translateX(-50%);
    background:linear-gradient(90deg,#dec29b,#fff5e4 45%,#d2b38b);
    box-shadow:0 0 0 1px rgba(131,101,69,.10);
  }
  .box-shine{
    position:absolute;left:13%;top:13%;width:6%;height:58%;
    border-radius:9px;
    background:rgba(228,244,249,.28);
    filter:blur(.3px);
  }
  .box-lid{
    position:absolute;left:4%;right:4%;top:27%;height:20%;
    z-index:3;
    border-radius:4px;
    background:linear-gradient(135deg,#c9dee8 0%,#94b7c9 54%,#6c95aa 100%);
    border:1px solid rgba(48,79,97,.4);
    box-shadow:0 3px 0 rgba(49,75,90,.10),inset 0 1px 0 rgba(255,255,255,.35);
    transform-origin:50% 95%;
    transition:transform .55s cubic-bezier(.2,.85,.25,1),opacity .35s ease;
  }
  .box-lid::before{
    content:"";position:absolute;left:50%;top:0;
    width:10%;height:100%;transform:translateX(-50%);
    background:linear-gradient(90deg,#e5cba5,#fff5e5 45%,#d8bb92);
  }
  .box-bow{
    position:absolute;left:50%;top:1%;width:54%;height:35%;
    z-index:4;
    transform:translateX(-50%);
    overflow:visible;
    filter:drop-shadow(0 2px 2px rgba(60,84,96,.12));
    transition:opacity .3s ease,transform .5s var(--ease);
  }
  .blind-box.is-open .box-lid{transform:translateY(-17px) rotate(-9deg);opacity:.72}
  .blind-box.is-open .box-bow{opacity:0;transform:translateX(-50%) translateY(-8px) rotate(-9deg)}
  .blind-box.is-open .box-mouth{opacity:1}
  .blind-box.is-open .box-body{filter:saturate(.72) brightness(.96)}

  .blind-foot{
    flex:none;
    display:flex;align-items:center;justify-content:space-between;gap:18px;
    padding-top:14px;
    border-top:1px solid var(--line-soft);
  }
  .blind-count{
    display:flex;align-items:baseline;
    white-space:nowrap;
    font-size:10.5px;line-height:1.5;letter-spacing:.12em;
    color:var(--muted);
  }
  .blind-count b{
    font-family:var(--sans);
    font-size:15px;line-height:1;font-weight:500;letter-spacing:0;
    color:var(--ink);
  }
  .count-bars{display:flex;align-items:center;gap:4px}
  .count-bars i{
    display:block;width:14px;height:3px;
    border-radius:999px;
    background:rgba(49,75,89,.13);
    transition:background .35s ease,width .35s var(--ease);
  }
  .count-bars i.is-on{background:var(--blue-deep)}

  /* 运势签 */
  .fortune-view{
    display:flex;flex-direction:column;align-items:center;
    width:100%;max-width:370px;gap:18px;
    opacity:0;transform:translateY(13px);
    transition:opacity .55s ease,transform .65s var(--ease-out);
  }
  .fortune-view.is-in{opacity:1;transform:none}
  .fortune-title{
    font-family:var(--serif);
    font-size:clamp(31px,9.4vw,41px);
    line-height:1.35;
    font-weight:500;
    letter-spacing:.01em;
    text-align:center;
    color:var(--ink);
  }
  .sign-stage{
    position:relative;
    display:grid;place-items:center;
    width:100%;
    height:clamp(230px,34vh,300px);
    padding:26px 22px;
    overflow:hidden;
    border:1px dashed rgba(49,75,89,.23);
    border-radius:15px;
    background:rgba(255,250,241,.55);
    transition:border-color .45s ease,background .5s ease,box-shadow .6s ease;
  }
  .sign-watermark{
    position:absolute;
    font-family:var(--serif);
    font-size:clamp(155px,49vw,215px);
    line-height:1;
    font-weight:500;
    color:rgba(49,88,113,.07);
    user-select:none;
    pointer-events:none;
    transition:opacity .45s ease;
  }
  .sign-content{
    position:relative;z-index:1;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    text-align:center;
  }
  .sign-level{
    min-height:1.2em;
    font-family:var(--serif);
    font-size:clamp(37px,10.8vw,51px);
    line-height:1.2;
    font-weight:500;
    letter-spacing:.12em;
    color:var(--ink);
    transition:color .4s ease;
  }
  .sign-line{
    display:block;width:52px;height:1px;
    background:rgba(49,75,89,.3);
    opacity:0;
    transition:opacity .4s ease;
  }
  .sign-text{
    min-height:1.8em;
    font-family:var(--serif);
    font-size:clamp(17px,4.8vw,21px);
    line-height:1.8;
    letter-spacing:.06em;
    color:var(--ink-2);
  }
  .sign-stage.is-rolling .sign-watermark{opacity:.02}
  .sign-stage.is-rolling .sign-content{animation:signRoll .14s linear infinite}
  @keyframes signRoll{
    0%,100%{transform:translateY(0);filter:blur(.15px)}
    50%{transform:translateY(-1px);filter:blur(.6px)}
  }
  .sign-stage.is-drawn{
    border-style:solid;
    border-color:rgba(165,78,63,.3);
    background:linear-gradient(180deg,#fffaf0,#f7ead6);
    box-shadow:
      0 22px 50px rgba(48,67,79,.12),
      inset 0 0 0 7px rgba(255,255,255,.42),
      inset 0 0 0 8px rgba(165,78,63,.12);
  }
  .sign-stage.is-drawn .sign-watermark{opacity:.04;transform:translateY(7%)}
  .sign-stage.is-drawn .sign-level{color:#8c4035}
  .sign-stage.is-drawn .sign-line{opacity:1;background:rgba(165,78,63,.3)}
  .sign-seal{
    position:absolute;right:14px;bottom:14px;
    display:grid;place-items:center;
    width:34px;height:34px;
    border:1px solid rgba(165,78,63,.52);
    border-radius:2px;
    color:#a54e3f;
    font-family:var(--serif);
    font-size:16px;
    opacity:0;
    transform:rotate(-7deg) scale(.9);
    transition:opacity .4s ease .35s,transform .45s var(--ease) .35s;
  }
  .sign-stage.is-drawn .sign-seal{opacity:.85;transform:rotate(-7deg) scale(1)}
  .fortune-actions{display:grid;place-items:center;width:100%;min-height:49px}
  .fortune-actions > *{grid-area:1/1}
  .draw-btn{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:148px;min-height:47px;
    padding:0 28px;
    border-radius:999px;
    background:var(--night);
    color:var(--cream);
    font-size:13px;line-height:1;letter-spacing:.12em;
    cursor:pointer;
    box-shadow:0 13px 28px rgba(13,33,50,.17);
    transition:transform .35s var(--ease),opacity .3s ease,background .3s ease;
  }
  .draw-btn:hover{transform:translateY(-2px);background:var(--blue-ink)}
  .draw-btn:disabled{opacity:.46;cursor:default;transform:none}
  .fortune-down{
    display:grid;place-items:center;
    width:41px;height:41px;
    border:1px solid rgba(49,88,113,.2);
    border-radius:50%;
    color:var(--blue-deep);
    background:rgba(255,250,241,.6);
    cursor:pointer;
    opacity:0;transform:translateY(7px);
    transition:opacity .4s ease,transform .45s var(--ease),background .3s ease;
  }
  .fortune-down.is-in{opacity:1;transform:none}
  .fortune-down:hover{background:#fffaf1}
  .fortune-down svg{width:15px;height:15px}

  /* 打开礼物 */
  body.modal-open{overflow:hidden}
  .gift-modal{
    position:fixed;inset:0;z-index:200;
    display:grid;place-items:center;
    padding:18px;
    background:rgba(8,22,33,.80);
    opacity:0;
    transition:opacity .28s ease;
  }
  .gift-modal.is-visible{opacity:1}
  .gift-card{
    position:relative;
    width:min(100%,380px);
    max-height:calc(100svh - 36px);
    padding:18px 18px 20px;
    overflow-y:auto;
    border:1px solid rgba(48,70,82,.14);
    border-radius:21px;
    background:
      radial-gradient(100% 70% at 50% 0%,#fffdf8,transparent 70%),
      var(--paper-2);
    box-shadow:0 30px 80px rgba(5,17,26,.32);
    transform:translateY(14px) scale(.985);
    transition:transform .45s var(--ease-out);
    -webkit-overflow-scrolling:touch;
  }
  .gift-modal.is-visible .gift-card{transform:none}
  .gift-card::before{
    content:"";position:absolute;left:50%;top:-8px;
    width:62px;height:16px;
    transform:translateX(-50%) rotate(-1.5deg);
    background:rgba(205,188,162,.42);
    clip-path:polygon(2% 8%,98% 0,100% 90%,0 100%);
    pointer-events:none;
  }
  .gift-modal-top{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    min-height:32px;
  }
  .gift-modal-index{
    font-size:9.5px;line-height:1.5;letter-spacing:.18em;
    color:var(--blue-deep);
  }
  .gift-modal-index b{font-weight:500}
  .modal-close{
    display:grid;place-items:center;
    width:33px;height:33px;
    margin-right:-4px;
    border:1px solid rgba(49,75,89,.16);
    border-radius:50%;
    color:var(--ink-2);
    background:rgba(255,250,241,.55);
    cursor:pointer;
    transition:opacity .25s ease,background .25s ease;
  }
  .modal-close:hover{background:#fffaf1}
  .modal-close:disabled{opacity:.22;cursor:default}
  .modal-close svg{width:14px;height:14px}
  .gift-copy{padding:13px 2px 0}
  .gift-copy h3{
    font-family:var(--serif);
    font-size:clamp(23px,6.6vw,29px);
    line-height:1.55;
    font-weight:500;
    letter-spacing:-.025em;
    color:var(--ink);
    text-wrap:balance;
  }
  .gift-copy p{
    margin-top:8px;
    color:var(--ink-2);
    font-size:13.5px;line-height:1.95;letter-spacing:.025em;
  }
  .gift-copy p:empty{display:none}
  .gift-load{
    height:2px;margin-top:17px;
    background:rgba(49,75,89,.10);
    border-radius:999px;
    overflow:hidden;
    opacity:1;
    transition:opacity .25s ease;
  }
  .gift-load i{
    display:block;width:0;height:100%;
    border-radius:inherit;
    background:linear-gradient(90deg,var(--peach),var(--blue));
  }
  .gift-modal.is-loading .gift-load i{animation:giftLoad 1s linear forwards}
  .gift-modal.is-photo .gift-load{opacity:0;height:0;margin-top:0}
  @keyframes giftLoad{to{width:100%}}
  .gift-photo{
    position:relative;
    width:100%;
    margin-top:0;
    max-height:0;
    overflow:hidden;
    border-radius:13px;
    opacity:0;
    transform:translateY(8px);
    transition:opacity .5s ease .04s,transform .55s var(--ease),max-height .6s var(--ease),margin .6s var(--ease);
  }
  .gift-modal.is-photo .gift-photo{
    max-height:320px;
    margin-top:15px;
    opacity:1;
    transform:none;
    aspect-ratio:1.62;
  }
  .gift-photo .scene-wrap{
    position:absolute;inset:0;
    display:grid;place-items:center;
    color:#4f7388;
    background:linear-gradient(138deg,#e4eef2,#d2e2e9);
    transition:opacity .35s ease;
  }
  .gift-photo .scene-wrap[data-scene="1"]{color:#876b57;background:linear-gradient(138deg,#f3e7da,#ead6c3)}
  .gift-photo .scene-wrap[data-scene="2"]{color:#5e7a6f;background:linear-gradient(138deg,#e8eee8,#d6e1d8)}
  .gift-photo .scene-wrap[data-scene="3"]{color:#8b754d;background:linear-gradient(138deg,#f5eedc,#e9ddba)}
  .gift-photo .scene-wrap[data-scene="4"]{color:#6a6880;background:linear-gradient(138deg,#eae8ef,#dbd8e4)}
  .gift-photo .scene-wrap svg{width:100%;height:100%}
  .gift-photo .scene-wrap::after{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(rgba(255,255,255,.55) .5px,transparent .5px);
    background-size:6px 6px;
    opacity:.16;pointer-events:none;
  }
  .gift-photo img{
    position:absolute;inset:0;z-index:2;
    width:100%;height:100%;
    object-fit:cover;
    opacity:0;
    transition:opacity .45s ease;
  }
  .gift-photo.has-photo img{opacity:1}
  .gift-photo.has-photo .scene-wrap{opacity:0}

  @media (max-height:720px){
    .blind{padding-top:62px}
    .blind-box{height:clamp(70px,21.5vw,88px)}
    .blind-tower{gap:8px}
    .tower-row{gap:10px}
    .sign-stage{height:clamp(205px,31vh,250px)}
    .fortune-view{gap:14px}
    .fortune-title{font-size:clamp(28px,8.6vw,36px)}
    .gift-card{max-height:calc(100svh - 24px);padding:16px}
  }
  @media (max-height:620px){
    .blind{padding-top:48px;padding-bottom:20px}
    .blind-box{height:clamp(62px,19vw,76px)}
    .blind-tower{gap:6px}
    .sign-stage{height:190px}
    .fortune-title{font-size:27px}
    .fortune-view{gap:10px}
    .draw-btn{min-height:43px}
  }
  @media (max-width:360px){
    .blind{padding-left:20px;padding-right:20px}
    .tower-row{gap:9px}
    .count-bars i{width:11px}
  }

  /* ============================================================
     03 · 蛋糕
     ============================================================ */
  .wish{
    display:flex;flex-direction:column;
    margin:0;
    padding:clamp(68px,9.5vh,92px) 24px max(25px,env(safe-area-inset-bottom));
    border-radius:0;
    color:var(--cream);
    background:
      radial-gradient(78% 52% at 50% 44%,rgba(54,109,136,.36),transparent 70%),
      radial-gradient(80% 60% at 88% 5%,rgba(94,142,162,.21),transparent 62%),
      radial-gradient(60% 45% at 8% 96%,rgba(210,150,119,.10),transparent 70%),
      linear-gradient(168deg,#0b1d2c 0%,#102b3d 48%,#16394c 100%);
    overflow:hidden;
    z-index:3;
  }
  .wish::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(255,247,233,.10) .48px,transparent .48px);
    background-size:5px 5px;
    opacity:.22;
  }
  .wish-sky{
    position:absolute;inset:0;z-index:0;pointer-events:none;
    color:rgba(255,247,233,.22);
  }
  .wish-sky .moon{position:absolute;right:-42px;top:34px;width:180px;height:180px;opacity:.72;animation:moonFloat 9s ease-in-out infinite alternate}
  .wish-sky .stars{position:absolute;inset:0;width:100%;height:100%}
  @keyframes moonFloat{
    from{transform:translateY(0)}
    to{transform:translateY(6px)}
  }
  .fireworks{
    position:absolute;inset:0;z-index:1;
    width:100%;height:100%;
    pointer-events:none;
  }
  .confetti{
    position:absolute;inset:0;z-index:2;
    overflow:hidden;pointer-events:none;
  }
  .confetti i{
    position:absolute;top:-24px;left:var(--x);
    display:block;
    width:var(--w);height:var(--h);
    border-radius:1.5px;
    background:var(--c);
    opacity:0;
    animation:confettiFall var(--dur) var(--delay) cubic-bezier(.22,.7,.35,1) forwards;
  }
  @keyframes confettiFall{
    0%{opacity:0;transform:translate3d(0,-12vh,0) rotate(0deg)}
    8%{opacity:.9}
    100%{opacity:.08;transform:translate3d(var(--dx),112vh,0) rotate(var(--rot))}
  }
  .confetti.is-static i{
    top:var(--y);opacity:.5;animation:none;
    transform:rotate(var(--r));
  }
  .wish-inner{
    position:relative;z-index:4;
    display:flex;flex-direction:column;
    flex:1;
    width:100%;max-width:400px;
    margin:0 auto;
  }
  .wish-head{flex:none}
  .wish-head .chapter{color:rgba(255,247,233,.48)}
  .wish-head .chapter::before{background:rgba(255,247,233,.34)}
  .wish-head .chapter b{color:rgba(239,208,181,.92)}
  .wish-titles{
    display:grid;
    margin-top:15px;
    align-items:start;
  }
  .wish-titles > *{grid-area:1/1}
  .wish-title{
    font-family:var(--serif);
    font-size:clamp(33px,9.6vw,43px);
    line-height:1.4;
    font-weight:500;
    letter-spacing:-.035em;
    color:var(--cream);
    text-wrap:balance;
    transition:opacity .55s ease,transform .65s var(--ease);
  }
  .wish-title.is-after{
    opacity:0;transform:translateY(8px);
    color:#fff3dc;
    text-align:center;
  }
  .wish.show-birthday .wish-title.is-after{opacity:1;transform:translateY(0)}
  .wish.show-birthday .title-glow{
    opacity:1;
  }
  .title-glow{
    position:absolute;left:-10%;right:-10%;top:0;height:100%;
    background:radial-gradient(60% 80% at 50% 50%,rgba(241,203,154,.15),transparent 70%);
    filter:blur(18px);pointer-events:none;opacity:0;transition:opacity 1s ease;
  }

  .cake-stage{
    position:relative;
    flex:1;
    display:flex;align-items:center;justify-content:center;
    min-height:0;
    width:100%;
    padding:6px 0 2px;
  }
  .cake-halo{
    position:absolute;
    left:50%;top:54%;
    width:min(91vw,390px);height:min(91vw,390px);
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle,rgba(119,175,199,.17) 0%,rgba(119,175,199,.06) 46%,transparent 70%);
    pointer-events:none;
    transition:transform 1.2s var(--ease),opacity .8s ease;
  }
  .cake-orbit{
    position:absolute;
    left:50%;top:52%;
    width:min(96vw,425px);height:min(96vw,425px);
    transform:translate(-50%,-50%);
    border:1px dashed rgba(255,247,233,.13);
    border-radius:50%;
    pointer-events:none;
  }
  .cake-orbit::before,.cake-orbit::after{
    content:"";position:absolute;width:3px;height:3px;border-radius:50%;
    background:rgba(255,247,233,.62);
    box-shadow:0 0 12px rgba(255,241,211,.5);
  }
  .cake-orbit::before{left:12%;top:22%}
  .cake-orbit::after{right:10%;bottom:24%}
  .cake-hit{
    position:relative;
    display:flex;flex-direction:column;align-items:center;
    width:min(96vw,410px);
    padding:0;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    touch-action:manipulation;
    border-radius:24px;
  }
  .cake-hit:focus-visible{outline-offset:9px}
  .cake-hit.is-locked{cursor:default}
  .cake-svg{
    width:min(89vw,355px);
    height:auto;
    overflow:visible;
    filter:drop-shadow(0 22px 26px rgba(0,0,0,.18));
    transition:transform .4s var(--ease);
  }
  .cake-hit:hover .cake-svg{transform:translateY(-2px)}
  .cake-action{
    display:inline-flex;align-items:center;justify-content:center;
    width:35px;height:35px;
    margin-top:-17px;
    padding:0;
    border:1px solid rgba(255,247,233,.22);
    border-radius:50%;
    background:rgba(9,25,38,.45);
    color:rgba(255,247,233,.76);
    transition:opacity .35s ease,transform .45s var(--ease),background .3s ease;
  }
  .cake-action svg{width:13px;height:13px;opacity:.7}
  .wish.is-celebrating .cake-action{opacity:0;transform:translateY(6px);pointer-events:none}
  .wish.is-holding .cake-svg{transform:scale(1.008)}
  .wish.is-holding .cake-halo{transform:translate(-50%,-50%) scale(1.06);opacity:1}

  /* 蛋糕上的火苗 */
  .flame{
    transform-box:fill-box;
    transform-origin:50% 100%;
    animation:flameSway 2.8s ease-in-out infinite;
  }
  .flame-2{animation-duration:3.35s;animation-delay:-.9s}
  .flame-3{animation-duration:3.05s;animation-delay:-1.7s}
  @keyframes flameSway{
    0%,100%{transform:rotate(-2deg) scale(1,1)}
    28%{transform:rotate(2.4deg) scale(.97,1.035)}
    52%{transform:rotate(-1deg) scale(1.015,.97)}
    74%{transform:rotate(3deg) scale(.985,1.02)}
  }
  .flame-halo{animation:haloPulse 2.4s ease-in-out infinite}
  @keyframes haloPulse{
    0%,100%{opacity:.36}
    50%{opacity:.58}
  }
  .candle.is-out .flame{
    animation:flameOut .62s cubic-bezier(.2,.7,.3,1) forwards;
  }
  .candle.is-out .flame-halo{animation:none;opacity:0;transition:opacity .15s ease}
  @keyframes flameOut{
    0%{opacity:1;transform:rotate(0) scale(1)}
    18%{opacity:1;transform:rotate(-8deg) scale(.9,.78)}
    35%{opacity:1;transform:rotate(6deg) scale(1.05,.92)}
    58%{opacity:.85;transform:rotate(-13deg) scale(.58,.33)}
    100%{opacity:0;transform:translateX(-5px) translateY(-4px) scale(.05,.02)}
  }
  .smoke{
    opacity:0;
    fill:none;
    stroke:rgba(255,247,233,.32);
    stroke-width:1.2;
    stroke-linecap:round;
    stroke-dasharray:30;
    stroke-dashoffset:30;
  }
  .candle.is-out .smoke{
    animation:smokeUp 2.5s ease-out .12s forwards;
  }
  .candle.is-out .smoke.s2{animation-delay:.24s;stroke-opacity:.7}
  @keyframes smokeUp{
    0%{opacity:0;stroke-dashoffset:30;transform:translateY(2px)}
    16%{opacity:.62}
    55%{opacity:.35}
    100%{opacity:0;stroke-dashoffset:-8;transform:translateY(-13px)}
  }
  .sparks{opacity:0}
  .candle.is-out .sparks{animation:sparkBloom .9s ease-out forwards}
  .candle.is-out .sparks .spark{animation:sparkFly .9s ease-out both}
  .candle.is-out .sparks .spark:nth-child(2){animation-delay:.06s}
  .candle.is-out .sparks .spark:nth-child(3){animation-delay:.12s}
  .candle.is-out .sparks .spark:nth-child(4){animation-delay:.03s}
  @keyframes sparkBloom{
    0%,100%{opacity:0}
    15%{opacity:1}
    60%{opacity:.9}
  }
  @keyframes sparkFly{
    from{opacity:1;transform:translate(0,0) scale(1)}
    to{opacity:0;transform:translate(var(--sx),var(--sy)) scale(.2)}
  }
  .gust{
    opacity:0;
    fill:none;
    stroke:rgba(255,247,233,.35);
    stroke-width:1.2;
    stroke-linecap:round;
  }
  .wish.is-puffing .gust{animation:gustSweep .55s ease-out both}
  @keyframes gustSweep{
    0%{opacity:0;transform:translateX(14px)}
    20%{opacity:.7}
    100%{opacity:0;transform:translateX(-18px)}
  }

  /* 底部提示与结局 */
  .wish-bottom{
    position:relative;
    flex:none;
    display:grid;place-items:center;
    min-height:81px;
    text-align:center;
  }
  .wish-bottom > *{grid-area:1/1;width:100%}
  .wish-prompt{
    transition:opacity .4s ease,transform .5s var(--ease);
  }
  .wish-prompt .line{
    display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:9px;
    color:rgba(255,247,233,.63);
    font-size:10.5px;line-height:1.7;letter-spacing:.1em;
  }
  .wish-prompt .line .sep{
    width:18px;height:1px;background:rgba(255,247,233,.18);
  }
  .wish-prompt .line svg{width:13px;height:13px;opacity:.68}
  .wish-prompt .sub{
    margin-top:4px;
    color:rgba(255,247,233,.4);
    font-size:9.5px;letter-spacing:.08em;
  }
  .hold-meter{
    display:block;position:relative;
    width:92px;height:2px;
    margin:11px auto 0;
    background:rgba(255,247,233,.12);
    border-radius:999px;
    overflow:hidden;
  }
  .hold-meter i{
    display:block;width:0;height:100%;
    border-radius:inherit;
    background:linear-gradient(90deg,var(--peach),#f4e4c7);
  }
  .wish.is-holding .hold-meter i{width:100%;transition:width .77s linear}
  .wish.is-celebrating .wish-prompt{opacity:0;transform:translateY(7px);pointer-events:none}
  .wish-finale{
    opacity:0;transform:translateY(8px);
    visibility:hidden;
    pointer-events:none;
    transition:opacity .7s ease .1s,transform .8s var(--ease) .1s;
  }
  .wish.show-finale .wish-finale{opacity:1;transform:none;visibility:visible;pointer-events:auto}
  .replay{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:10px;
    padding:4px 2px;
    color:rgba(255,247,233,.48);
    font-size:9.5px;line-height:1.5;letter-spacing:.08em;
    cursor:pointer;
    border-bottom:1px solid rgba(255,247,233,.16);
    transition:color .25s ease,border-color .25s ease;
  }
  .replay:hover{color:rgba(255,247,233,.72);border-color:rgba(255,247,233,.3)}
  .replay svg{width:11px;height:11px}

  /* 短屏适配 */
  @media (max-height:720px){
    .opening{padding-top:max(22px,env(safe-area-inset-top));padding-bottom:calc(max(20px,env(safe-area-inset-bottom)) + 30px);gap:18px}
    .opening-kicker{margin-bottom:15px}
    .opening h1{font-size:clamp(38px,10.8vw,48px)}
    .blind{padding-top:62px}
    .wish{padding-top:56px}
    .wish-title{font-size:clamp(29px,8.7vw,37px)}
    .cake-svg{width:min(75vw,300px)}

  }
  @media (max-width:360px){

  }

    .wish-bottom{min-height:59px}
    .hold-meter{margin-top:7px}
  }
  @media (min-width:700px){
    .page{border-radius:0;height:100svh}
    .opening,.blind,.wish{max-width:480px;margin-left:auto;margin-right:auto}
    .opening-art{right:-120px;top:-150px;width:540px;height:540px}
  }

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      animation-delay:0ms !important;
      transition-duration:.001ms !important;
      scroll-behavior:auto !important;
    }
    .opening-art,.blind-box.is-last .box-art,.flame,.flame-halo,.wish-sky .moon{animation:none !important}
    .petal,.star,.confetti i{display:none}
    [data-reveal]{opacity:1 !important;transform:none !important}
    .wish-prompt,.wish-title,.wish-finale{opacity:1;transform:none}
    .wish-title.is-after{opacity:0}
  }
</style>
<noscript>
  <style>
    [data-reveal]{opacity:1 !important;transform:none !important}
    .wish-title.is-after{opacity:1;transform:none}
  </style>
</noscript>
</head>

        <circle cx="260" cy="121" r="1.8" opacity=".38"/>
        <circle cx="63" cy="70" r="1.7" opacity=".34"/>

        <circle cx="220" cy="122" r="5" opacity=".52"/>

    <symbol id="scene-ice" viewBox="0 0 320 190">
      <g fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">

        <path d="M157 73c2-5 8-7 13-4" opacity=".45"/>

      <g fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
        <path d="M58 51h135a13 13 0 0 1 13 13v44a13 13 0 0 1-13 13h-62l-24 18v-18H58a13 13 0 0 1-13-13V64a13 13 0 0 1 13-13Z"/>
        <path d="M76 75h98M76 88h72M76 101h48" opacity=".45"/>

          <circle cx="220" cy="103" r="2"/><circle cx="232" cy="103" r="2"/><circle cx="244" cy="103" r="2"/>

</svg>

<script>
(() => {
  "use strict";

  const cfg = window.BIRTHDAY_CONFIG || {};
  const fallback = window.BIRTHDAY_FALLBACK || {};
  const placeholderPattern = /\{\{[\s\S]*?\}\}/;
  const clean = (value) => typeof value === "string" ? value.trim() : "";
  const isPlaceholder = (value) => typeof value === "string" && placeholderPattern.test(value);
  const pick = (value, fallbackValue) => {
    const v = clean(value);
    return v && !isPlaceholder(v) ? v : fallbackValue;
  };

  const gifts = (Array.isArray(fallback.gifts) ? fallback.gifts : []).map((item, index) => {
    const candidate = Array.isArray(cfg.gifts) ? (cfg.gifts[index] || {}) : {};
    return {
      title: pick(candidate.title, item.title || ""),
      text: pick(candidate.text, item.text || ""),
      photo: isPlaceholder(candidate.photo) ? "" : clean(candidate.photo)
    };
  });

  const DATA = {
    nickname: pick(cfg.nickname, fallback.nickname || "阿吱"),
    birthday: pick(cfg.birthday, fallback.birthday || "11.25"),
    gifts
  };

  const $ = (selector, scope = document) => scope.querySelector(selector);
  const $$ = (selector, scope = document) => Array.from(scope.querySelectorAll(selector));
  const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
  let reduceMotion = motionQuery.matches;
  if (typeof motionQuery.addEventListener === "function") {
    motionQuery.addEventListener("change", (event) => {
      reduceMotion = event.matches;
    });
  } else if (typeof motionQuery.addListener === "function") {
    motionQuery.addListener((event) => {
      reduceMotion = event.matches;
    });
  }

  document.title = `${DATA.nickname}的生日小页`;
  $$("[data-nickname]").forEach((node) => { node.textContent = DATA.nickname; });
  $$("[data-birthday]").forEach((node) => { node.textContent = DATA.birthday; });
  $("#birthdayTitle").textContent = `${DATA.nickname}，生日快乐`;

  /* ---------------- 音乐 ---------------- */
  const bgm = $("#bgm");
  const soundToggle = $("#soundToggle");
  let musicStarted = false;

  function syncSoundUI() {
    const paused = bgm.paused || bgm.ended || !bgm.currentSrc;
    soundToggle.classList.toggle("is-muted", paused);
    soundToggle.setAttribute("aria-pressed", paused ? "false" : "true");
    soundToggle.setAttribute("aria-label", paused ? "播放音乐" : "暂停音乐");
  }

  function startMusic() {
    if (!bgm) return;
    if (!musicStarted) {
      bgm.volume = 0.42;
      bgm.addEventListener("play", syncSoundUI);
      bgm.addEventListener("pause", syncSoundUI);
      bgm.addEventListener("ended", syncSoundUI);
      musicStarted = true;
    }
    if (soundToggle.hidden) {
      soundToggle.hidden = false;
      requestAnimationFrame(() => soundToggle.classList.add("is-visible"));
    }
    const playback = bgm.play();
    if (playback && typeof playback.catch === "function") {
      playback.catch(() => syncSoundUI());
    }
    syncSoundUI();
  }

  soundToggle.addEventListener("click", () => {
    if (bgm.paused || bgm.ended) startMusic();
    else bgm.pause();
  });

  /* ---------------- 页面切换 ---------------- */
  const opening = $("#opening");
  const blind = $("#blind");
  const wish = $("#wish");
  const page = $(".page");
  const openingNext = $("#openingNext");
  $$("[data-reveal]").forEach((node) => node.classList.add("is-in"));

  function showView(name) {
    const shouldStartMusic = name !== "opening" && !musicStarted;
    const views = { opening, blind, wish };
    Object.entries(views).forEach(([key, section]) => {
      const active = key === name;
      section.classList.toggle("is-active", active);
      section.setAttribute("aria-hidden", String(!active));
    });

    // 切换页面不依赖音乐；音乐加载失败也照常翻页
    if (shouldStartMusic) {
      try {
        startMusic();
      } catch (error) {
        console.warn("Music could not start:", error);
      }
    }

    window.setTimeout(() => {
      const activeSection = views[name];
      if (activeSection) activeSection.focus({ preventScroll: true });
    }, reduceMotion ? 0 : 420);
  }

  /* ---------------- 盲盒 ---------------- */
  const sceneIds = ["scene-cup", "scene-walk", "scene-rain", "scene-ice", "scene-chat"];
  const boxes = $$(".blind-box");
  const openedCountNode = $("#openedCount");
  const countBars = $$("#countBars i");
  const blindStatus = $("#blindStatus");
  const giftModal = $("#giftModal");
  const giftCard = $("#giftCard");
  const skipLink = $(".skip");

  openingNext.addEventListener("click", () => showView("blind"));
  if (skipLink) {
    skipLink.addEventListener("click", (event) => {
      event.preventDefault();
      showView("blind");
    });
  }
  const giftIndexNode = $("#giftIndex");
  const giftTitleNode = $("#giftTitle");
  const giftTextNode = $("#giftText");
  const giftPhoto = $("#giftPhoto");
  const giftScene = $("#giftScene");
  const giftSceneUse = $("#giftSceneUse");
  const giftImg = $("#giftImg");
  const modalClose = $("#modalClose");
  const fortuneView = $("#fortuneView");
  const fortuneTitle = $("#fortuneTitle");
  const signStage = $("#signStage");
  const signLevel = $("#signLevel");
  const signText = $("#signText");
  const drawBtn = $("#drawBtn");
  const fortuneDown = $("#fortuneDown");

  const BOX_COUNT = 6;
  const GIFT_COUNT = 5;
  const giftSequence = shuffle(DATA.gifts.slice(0, GIFT_COUNT));
  while (giftSequence.length < GIFT_COUNT) {
    giftSequence.push({ title: "", text: "", photo: "", scene: giftSequence.length });
  }

  let openedCount = 0;
  let giftCursor = 0;
  let locked = false;
  let modalTimer = 0;
  let lastOpenedBox = null;

  function pad2(number) {
    return String(number).padStart(2, "0");
  }

  function shuffle(list) {
    const result = list.map((item, index) => ({ ...item, scene: index }));
    for (let i = result.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }

  function updateBlindCount() {
    openedCountNode.textContent = String(openedCount);
    countBars.forEach((bar, index) => {
      bar.classList.toggle("is-on", index < openedCount);
    });
    blindStatus.textContent = `已开启 ${openedCount} / 6`;
  }

  function markBoxOpen(box) {
    box.classList.add("is-open");
    box.disabled = true;
    lastOpenedBox = box;
  }

  function highlightRemainingBox() {
    const remaining = boxes.filter((box) => !box.disabled);
    if (remaining.length === 1) remaining[0].classList.add("is-last");
  }

  function resetGiftPhoto() {
    giftImg.onload = null;
    giftImg.onerror = null;
    giftImg.removeAttribute("src");
    giftImg.alt = "";
    giftPhoto.classList.remove("has-photo");
  }

  function loadGiftPhoto(gift) {
    resetGiftPhoto();
    giftScene.dataset.scene = String(gift.scene || 0);
    giftSceneUse.setAttribute("href", `#${sceneIds[gift.scene] || sceneIds[0]}`);
    if (!gift.photo) return;
    giftImg.onload = () => {
      if (giftModal.hidden) return;
      giftPhoto.classList.add("has-photo");
      giftImg.onerror = null;
    };
    giftImg.onerror = () => {
      giftPhoto.classList.remove("has-photo");
      giftImg.removeAttribute("src");
      giftImg.onerror = null;
    };
    giftImg.alt = `${gift.title || "礼物"}照片`;
    giftImg.src = gift.photo;
  }

  function showGiftModal(gift, number) {
    giftIndexNode.textContent = pad2(number);
    giftTitleNode.textContent = gift.title || `礼物 ${pad2(number)}`;
    giftTextNode.textContent = gift.text || "";
    loadGiftPhoto(gift);

    window.clearTimeout(modalTimer);
    giftModal.classList.remove("is-photo", "is-loading", "is-visible");
    giftPhoto.setAttribute("aria-hidden", "true");
    modalClose.disabled = true;
    giftModal.hidden = false;
    document.body.classList.add("modal-open");
    page.inert = true;
    if (skipLink) skipLink.inert = true;

    requestAnimationFrame(() => {
      giftModal.classList.add("is-visible", "is-loading");
      giftCard.focus({ preventScroll: true });
    });

    modalTimer = window.setTimeout(() => {
      if (giftModal.hidden) return;
      giftModal.classList.add("is-photo");
      giftModal.classList.remove("is-loading");
      giftPhoto.setAttribute("aria-hidden", "false");
      modalClose.disabled = false;
    }, 1000);
  }

  function closeGiftModal() {
    if (modalClose.disabled || giftModal.hidden) return;
    window.clearTimeout(modalTimer);
    giftModal.classList.remove("is-visible");
    document.body.classList.remove("modal-open");
    page.inert = false;
    if (skipLink) skipLink.inert = false;

    window.setTimeout(() => {
      giftModal.hidden = true;
      giftModal.classList.remove("is-photo", "is-loading");
      resetGiftPhoto();
    }, reduceMotion ? 0 : 280);

    locked = false;
    if (openedCount === GIFT_COUNT) highlightRemainingBox();
    const nextBox = boxes.find((box) => !box.disabled);
    if (nextBox) nextBox.focus({ preventScroll: true });
  }

  function showFortune() {
    blind.classList.add("is-fortune");
    fortuneTitle.textContent = `${DATA.nickname}专属签`;
    fortuneView.hidden = false;
    requestAnimationFrame(() => fortuneView.classList.add("is-in"));
    blindStatus.textContent = `六个盲盒都打开了，${DATA.nickname}专属签`;
    locked = false;
    window.setTimeout(() => {
      drawBtn.focus({ preventScroll: true });
    }, reduceMotion ? 0 : 360);
  }

  function openBlindBox(box) {
    if (locked || box.disabled || openedCount >= BOX_COUNT) return;
    locked = true;
    markBoxOpen(box);
    openedCount += 1;
    updateBlindCount();

    if (openedCount === BOX_COUNT) {
      window.setTimeout(showFortune, reduceMotion ? 80 : 430);
      return;
    }

    const gift = giftSequence[giftCursor % giftSequence.length];
    giftCursor += 1;
    const number = giftCursor;
    window.setTimeout(() => {
      showGiftModal(gift, number);
    }, reduceMotion ? 60 : 340);
  }

  boxes.forEach((box) => {
    box.addEventListener("click", () => openBlindBox(box));
  });

  modalClose.addEventListener("click", closeGiftModal);
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !giftModal.hidden && !modalClose.disabled) {
      closeGiftModal();
    }
  });

  const SIGNS = [
    { level: "上上签", text: "心想事成，开心幸福" },
    { level: "上签", text: "诸事顺遂，常有好事" },
    { level: "大吉", text: "平安喜乐，得偿所愿" },
    { level: "中吉", text: "不慌不忙，自有答案" },
    { level: "小吉", text: "吃好睡好，心情不错" },
    { level: "吉", text: "一切顺利，来日可期" }
  ];
  const FINAL_SIGN = SIGNS[0];
  let rolling = false;
  let drawn = false;
  let rollInterval = 0;
  let rollStopTimer = 0;

  function renderSign(sign) {
    signLevel.textContent = sign.level;
    signText.textContent = sign.text;
  }

  drawBtn.addEventListener("click", () => {
    if (rolling || drawn) return;
    rolling = true;
    drawBtn.disabled = true;
    signStage.classList.add("is-rolling");
    signStage.setAttribute("aria-busy", "true");

    let index = 1;
    renderSign(SIGNS[index]);
    rollInterval = window.setInterval(() => {
      index = (index + 1) % SIGNS.length;
      renderSign(SIGNS[index]);
    }, 70);

    rollStopTimer = window.setTimeout(() => {
      window.clearInterval(rollInterval);
      rollInterval = 0;
      renderSign(FINAL_SIGN);
      signStage.classList.remove("is-rolling");
      signStage.classList.add("is-drawn");
      signStage.setAttribute("aria-busy", "false");
      blindStatus.textContent = "上上签，心想事成，开心幸福";
      drawBtn.hidden = true;
      fortuneDown.hidden = false;
      requestAnimationFrame(() => fortuneDown.classList.add("is-in"));
      rolling = false;
      drawn = true;
    }, 1300);
  });

  fortuneDown.addEventListener("click", () => {
    showView("wish");
  });

  updateBlindCount();

  /* ---------------- 吹蜡烛 ---------------- */
  const cakeBtn = $("#cakeBtn");
  const candles = [$("#candle1"), $("#candle2"), $("#candle3")];
  const wishSub = $("#wishSub");
  const cakeStatus = $("#cakeStatus");
  const wishPrompt = $("#wishPrompt");
  const wishFinale = $("#wishFinale");
  const replayBtn = $("#replayBtn");
  const afterTitle = $(".wish-title.is-after");
  let litCount = candles.length;
  let celebrating = false;
  let busy = false;
  let holdTimer = 0;
  let longPressFired = false;
  let pointerActive = false;
  let lastPointerTime = 0;
  let wishTimers = [];
  const HOLD_MS = 780;

  function clearWishTimers() {
    wishTimers.forEach((timer) => window.clearTimeout(timer));
    wishTimers = [];
  }

  function later(fn, delay) {
    const timer = window.setTimeout(fn, delay);
    wishTimers.push(timer);
    return timer;
  }

  function updateWishSub() {
    if (litCount === 3) wishSub.textContent = "三根都亮着";
    else if (litCount === 2) wishSub.textContent = "还剩两根";
    else if (litCount === 1) wishSub.textContent = "最后一根";
    else wishSub.textContent = "都吹灭了";
  }

  function blowOneCandle() {
    if (busy || celebrating || litCount <= 0) return;
    const candle = candles.find((item) => !item.classList.contains("is-out"));
    if (!candle) return;
    busy = true;
    candle.classList.add("is-out");
    litCount -= 1;
    wish.classList.add("is-puffing");
    window.setTimeout(() => wish.classList.remove("is-puffing"), 600);
    updateWishSub();
    cakeStatus.textContent = litCount > 0 ? `吹灭一根，还剩 ${litCount} 根。` : "三根蜡烛都吹灭了。";
    if (litCount === 0) {
      cakeBtn.classList.add("is-locked");
      later(finishCelebration, reduceMotion ? 40 : 720);
    }
    window.setTimeout(() => { busy = false; }, reduceMotion ? 30 : 430);
  }

  function blowAllCandles() {
    if (celebrating || litCount <= 0) return;
    longPressFired = true;
    wish.classList.remove("is-holding");
    wish.classList.add("is-puffing");
    cakeBtn.classList.add("is-locked");
    candles.forEach((candle, index) => {
      if (candle.classList.contains("is-out")) return;
      window.setTimeout(() => {
        candle.classList.add("is-out");
        litCount = Math.max(0, litCount - 1);
        updateWishSub();
        if (litCount === 0) {
          cakeStatus.textContent = "三根蜡烛都吹灭了。";
          later(finishCelebration, reduceMotion ? 40 : 720);
        }
      }, reduceMotion ? 0 : index * 105);
    });
    window.setTimeout(() => wish.classList.remove("is-puffing"), 700);
    cakeStatus.textContent = "一口气吹灭了所有蜡烛。";
  }

  function finishCelebration() {
    if (celebrating) return;
    celebrating = true;
    wish.classList.add("is-celebrating");
    wishPrompt.setAttribute("aria-hidden", "true");
    later(() => {
      wish.classList.add("show-birthday");
      afterTitle.removeAttribute("aria-hidden");
      cakeStatus.textContent = `${DATA.nickname}，生日快乐。`;
    }, reduceMotion ? 20 : 720);
    later(() => {
      wish.classList.add("show-finale");
      wishPrompt.setAttribute("aria-hidden", "true");
      wishFinale.removeAttribute("aria-hidden");
      wishFinale.removeAttribute("inert");
    }, reduceMotion ? 60 : 1650);
    later(() => startFireworks(), reduceMotion ? 0 : 260);
    if (reduceMotion) {
      spawnConfetti(true);
    } else {
      later(() => spawnConfetti(false), 320);
    }
  }

  function resetWish() {
    clearWishTimers();
    stopFireworks();
    clearConfetti();
    celebrating = false;
    busy = false;
    litCount = candles.length;
    longPressFired = false;
    pointerActive = false;
    window.clearTimeout(holdTimer);
    candles.forEach((candle) => candle.classList.remove("is-out"));
    cakeBtn.classList.remove("is-locked");
    wish.classList.remove("is-celebrating", "show-birthday", "show-finale", "is-puffing", "is-holding");
    afterTitle.setAttribute("aria-hidden", "true");
    wishPrompt.removeAttribute("aria-hidden");
    wishFinale.setAttribute("aria-hidden", "true");
    wishFinale.setAttribute("inert", "");
    updateWishSub();
    cakeStatus.textContent = "蜡烛重新点上了。";
  }

  function beginHold(event) {
    if (celebrating || litCount <= 0) return;
    if (event.pointerType === "mouse" && event.button !== 0) return;
    lastPointerTime = performance.now();
    pointerActive = true;
    longPressFired = false;
    wish.classList.add("is-holding");
    window.clearTimeout(holdTimer);
    holdTimer = window.setTimeout(() => {
      if (!pointerActive) return;
      blowAllCandles();
    }, HOLD_MS);
    if (cakeBtn.setPointerCapture) {
      try { cakeBtn.setPointerCapture(event.pointerId); } catch (error) { /* ignore */ }
    }
  }

  function endHold(event) {
    if (!pointerActive) return;
    pointerActive = false;
    lastPointerTime = performance.now();
    window.clearTimeout(holdTimer);
    wish.classList.remove("is-holding");
    if (!longPressFired && !celebrating && litCount > 0) {
      blowOneCandle();
    }
    longPressFired = false;
  }

  cakeBtn.addEventListener("pointerdown", beginHold);
  cakeBtn.addEventListener("pointerup", endHold);
  cakeBtn.addEventListener("pointercancel", () => {
    pointerActive = false;
    window.clearTimeout(holdTimer);
    wish.classList.remove("is-holding");
    longPressFired = false;
  });
  cakeBtn.addEventListener("contextmenu", (event) => event.preventDefault());
  cakeBtn.addEventListener("click", (event) => {
    // 指针操作已经处理过；这里只负责键盘/辅助技术的激活。
    if (performance.now() - lastPointerTime < 500) {
      event.preventDefault();
      return;
    }
    if (!celebrating && litCount > 0) blowOneCandle();
  });
  replayBtn.addEventListener("click", resetWish);

  /* ---------------- 烟花 ---------------- */
  const fxCanvas = $("#fireworks");
  const fxContext = fxCanvas.getContext("2d");
  const confettiLayer = $("#confetti");
  let fxRunning = false;
  let fxFrame = 0;
  let fxParticles = [];
  let fxRockets = [];
  let fxLastTime = 0;
  let fxStopTime = 0;
  let fxWidth = 0;
  let fxHeight = 0;
  let fxDpr = 1;
  let fxLaunchTimers = [];

  function resizeFireworks() {
    const rect = wish.getBoundingClientRect();
    fxWidth = Math.max(1, rect.width);
    fxHeight = Math.max(1, rect.height);
    fxDpr = Math.min(window.devicePixelRatio || 1, 2);
    fxCanvas.width = Math.round(fxWidth * fxDpr);
    fxCanvas.height = Math.round(fxHeight * fxDpr);
    fxCanvas.style.width = `${fxWidth}px`;
    fxCanvas.style.height = `${fxHeight}px`;
    fxContext.setTransform(fxDpr, 0, 0, fxDpr, 0, 0);
  }

  function fireworkPalette() {
    return ["#f7e5bf", "#acd4e7", "#e4aa88", "#fff8e9", "#c8b8d8", "#e8c886"];
  }

  function launchRocket() {
    if (!fxRunning) return;
    const color = fireworkPalette()[Math.floor(Math.random() * fireworkPalette().length)];
    fxRockets.push({
      x: fxWidth * (0.18 + Math.random() * 0.64),
      y: fxHeight * 0.82,
      px: 0,
      py: 0,
      vx: (Math.random() - 0.5) * 0.45,
      vy: -(5.8 + Math.random() * 2.2),
      targetY: fxHeight * (0.14 + Math.random() * 0.27),
      color
    });
  }

  function burstParticles(x, y, color) {
    const count = 56 + Math.floor(Math.random() * 28);
    for (let i = 0; i < count; i += 1) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.12;
      const speed = 1.35 + Math.random() * 3.8;
      fxParticles.push({
        x,
        y,
        px: x,
        py: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 52 + Math.random() * 40,
        maxLife: 92,
        color: Math.random() > 0.72 ? "#fff8e9" : color,
        size: 1.1 + Math.random() * 1.7
      });
    }
    // 爆开的一瞬间，补一层很轻的光
    fxParticles.push({
      x, y, px: x, py: y,
      vx: 0, vy: 0,
      life: 12, maxLife: 12,
      color: "#fff4d6", size: 9,
      flash: true
    });
  }

  function drawFireworks(time) {
    if (!fxRunning) return;
    const delta = Math.min(2.4, Math.max(0.7, (time - fxLastTime) / 16.67));
    fxLastTime = time;

    fxContext.clearRect(0, 0, fxWidth, fxHeight);
    fxContext.globalCompositeOperation = "lighter";
    fxContext.lineCap = "round";

    for (let i = fxRockets.length - 1; i >= 0; i -= 1) {
      const rocket = fxRockets[i];
      rocket.px = rocket.x;
      rocket.py = rocket.y;
      rocket.x += rocket.vx * delta;
      rocket.y += rocket.vy * delta;
      rocket.vy += 0.045 * delta;
      fxContext.globalAlpha = 0.85;
      fxContext.strokeStyle = rocket.color;
      fxContext.lineWidth = 1.4;
      fxContext.beginPath();
      fxContext.moveTo(rocket.px, rocket.py);
      fxContext.lineTo(rocket.x, rocket.y);
      fxContext.stroke();
      if (rocket.y <= rocket.targetY || rocket.vy >= -0.7) {
        burstParticles(rocket.x, rocket.y, rocket.color);
        fxRockets.splice(i, 1);
      }
    }

    for (let i = fxParticles.length - 1; i >= 0; i -= 1) {
      const particle = fxParticles[i];
      particle.px = particle.x;
      particle.py = particle.y;
      particle.x += particle.vx * delta;
      particle.y += particle.vy * delta;
      particle.vx *= 0.988;
      particle.vy = particle.vy * 0.988 + 0.035 * delta;
      particle.life -= delta;
      if (particle.life <= 0) {
        fxParticles.splice(i, 1);
        continue;
      }
      const alpha = Math.max(0, particle.life / particle.maxLife);
      fxContext.globalAlpha = particle.flash ? alpha * 0.13 : alpha;
      fxContext.strokeStyle = particle.color;
      fxContext.fillStyle = particle.color;
      fxContext.shadowBlur = particle.flash ? 26 : 0;
      fxContext.shadowColor = particle.color;
      fxContext.lineWidth = particle.size;
      fxContext.beginPath();
      fxContext.moveTo(particle.px, particle.py);
      fxContext.lineTo(particle.x, particle.y);
      fxContext.stroke();
      if (particle.flash) {
        fxContext.beginPath();
        fxContext.arc(particle.x, particle.y, particle.size * (1.7 - alpha), 0, Math.PI * 2);
        fxContext.fill();
      } else if (particle.life > particle.maxLife * 0.76) {
        fxContext.globalAlpha = alpha * 0.7;
        fxContext.fillStyle = "#fffdf4";
        fxContext.beginPath();
        fxContext.arc(particle.x, particle.y, particle.size * 1.1, 0, Math.PI * 2);
        fxContext.fill();
      }
    }
    fxContext.shadowBlur = 0;

    fxContext.globalAlpha = 1;
    fxContext.globalCompositeOperation = "source-over";

    if (time > fxStopTime) {
      fxParticles = [];
      fxRockets = [];
      fxRunning = false;
      fxContext.clearRect(0, 0, fxWidth, fxHeight);
      return;
    }
    fxFrame = requestAnimationFrame(drawFireworks);
  }

  function startFireworks() {
    if (reduceMotion) return;
    stopFireworks();
    resizeFireworks();
    fxRunning = true;
    fxParticles = [];
    fxRockets = [];
    fxLastTime = performance.now();
    fxStopTime = fxLastTime + 5400;
    launchRocket();
    [300, 620, 940, 1280, 1660, 2010].forEach((delay, index) => {
      fxLaunchTimers.push(window.setTimeout(() => {
        if (index % 2 === 0) launchRocket();
        launchRocket();
      }, delay));
    });
    fxFrame = requestAnimationFrame(drawFireworks);
  }

  function stopFireworks() {
    fxRunning = false;
    window.cancelAnimationFrame(fxFrame);
    fxLaunchTimers.forEach((timer) => window.clearTimeout(timer));
    fxLaunchTimers = [];
    fxParticles = [];
    fxRockets = [];
    if (fxContext) fxContext.clearRect(0, 0, fxWidth || fxCanvas.width, fxHeight || fxCanvas.height);
  }

  function spawnConfetti(staticMode) {
    clearConfetti();
    const colors = ["#f7e5bf", "#a8cede", "#e3a686", "#fff8e9", "#d4c5df", "#e8c886"];
    const count = staticMode ? 18 : 48;
    for (let i = 0; i < count; i += 1) {
      const piece = document.createElement("i");
      const w = 4 + Math.random() * 6;
      const h = 7 + Math.random() * 8;
      piece.style.setProperty("--x", `${Math.random() * 100}%`);
      piece.style.setProperty("--w", `${w}px`);
      piece.style.setProperty("--h", `${h}px`);
      piece.style.setProperty("--c", colors[Math.floor(Math.random() * colors.length)]);
      piece.style.setProperty("--dur", `${2.8 + Math.random() * 2.4}s`);
      piece.style.setProperty("--delay", `${Math.random() * 0.9}s`);
      piece.style.setProperty("--dx", `${(Math.random() - 0.5) * 100}px`);
      piece.style.setProperty("--rot", `${360 + Math.random() * 900}deg`);
      piece.style.setProperty("--y", `${12 + Math.random() * 70}%`);
      piece.style.setProperty("--r", `${Math.random() * 180}deg`);
      if (staticMode) confettiLayer.classList.add("is-static");
      confettiLayer.appendChild(piece);
    }
  }

  function clearConfetti() {
    confettiLayer.classList.remove("is-static");
    confettiLayer.replaceChildren();
  }

  window.addEventListener("resize", () => {
    if (fxRunning || wish.classList.contains("is-celebrating")) {
      if (fxRunning) {
        resizeFireworks();
      }
    }
  });

  updateWishSub();
})();
</script>
</body>
</html>
